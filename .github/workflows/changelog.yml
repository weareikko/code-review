name: Changelog

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Every change to what ships (the package, the composite action and the
      # reusable workflow) needs a fragment in .changelog/, unless the pull
      # request has the `no-changelog` label (tests, refactors, tooling).
      - uses: weareikko/changelog@492f8b1cd2aa5e2462d51d4ff75a70e019c81844 # 1.2.1
        with:
          command: check
          require-paths: |
            src/**
            bin/**
            skills/**
            action.yml
            .github/workflows/code-review.yml
