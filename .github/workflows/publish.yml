name: Publish

# Run from the Actions tab or with `gh workflow run publish.yml -f bump=patch`.
# npm trusted publishing is bound to this file name: keep the publish job here.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (on 0.x, a minor bump marks a breaking change; the pre* bumps create a prerelease)'
        type: choice
        options: [patch, minor, major, prepatch, preminor, premajor, prerelease]
        default: patch
      preid:
        description: 'Prerelease identifier, used by the pre* bumps only'
        type: choice
        options: [alpha, beta, rc]
        default: alpha

concurrency: release

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build package
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

  release:
    name: Bump version and changelog
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
      # A stable release of a prerelease can have no new fragment: its body
      # then names the prerelease.
      body: ${{ steps.changelog.outputs.changed == 'true' && steps.changelog.outputs.body || format('Stable release of {0}.', steps.version.outputs.previous) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The changelog action reads the commit that added each fragment.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      # A prerelease version (with a `-`, e.g. 1.2.0-beta.0) goes to the `next`
      # dist-tag on npm, any other version to `latest`.
      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          PREID: ${{ inputs.preid }}
        run: |
          PREVIOUS="$(node -p 'require("./package.json").version')"
          npm version "$BUMP" --preid "$PREID" --no-git-tag-version
          VERSION="$(node -p 'require("./package.json").version')"
          if [[ $VERSION == *-* ]]; then
            PRERELEASE=true
            DIST_TAG=next
          else
            PRERELEASE=false
            DIST_TAG=latest
          fi
          {
            echo "previous=$PREVIOUS"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "dist-tag=$DIST_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Fold changelog fragments
        id: changelog
        uses: weareikko/changelog@c25888e03ad7c8bbaee897b84e778ebce9e9301c # 1.0.3
        with:
          command: release
          version: ${{ steps.version.outputs.version }}

      # Promoting a prerelease (1.0.0-rc.1 to 1.0.0) can have no new fragment:
      # the prerelease already folded them.
      - name: Fail when there is nothing to release
        if: steps.changelog.outputs.changed != 'true'
        env:
          PREVIOUS: ${{ steps.version.outputs.previous }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ $PREVIOUS == *-* && $VERSION != *-* ]]; then
            echo "::notice::No fragment in .changelog/: stable release of $PREVIOUS."
            exit 0
          fi
          echo "::error::No fragment in .changelog/: nothing to release."
          exit 1

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .changelog package.json package-lock.json
          git commit -m "chore: release $VERSION"
          git tag "$VERSION"
          git push origin HEAD:main "$VERSION"

  # A tag pushed with GITHUB_TOKEN does not start other workflows, so the
  # publish job runs in this workflow, on the tag the release job pushed.
  # Every step can run again: npm skips a version it already has, and the
  # GitHub release is updated when it exists. "Re-run failed jobs" on this
  # job publishes what a failed run left.
  publish:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      PRERELEASE: ${{ needs.release.outputs.prerelease }}
      DIST_TAG: ${{ needs.release.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.release.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The action publishes with --ignore-scripts, so `prepublishOnly` does not
      # run: this step builds `dist/`, and the test job ran the checks.
      - name: Build package
        run: npm run build

      # Trusted publishing (OIDC): no npm token. A version that npm already
      # has is skipped.
      - name: Publish @weareikko/code-review
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: .
          access: public
          provenance: true
          tag: ${{ env.DIST_TAG }}

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ needs.release.outputs.version }}
          name: ${{ needs.release.outputs.version }}
          body: ${{ needs.release.outputs.body }}
          prerelease: ${{ env.PRERELEASE }}
          # GitHub's latest release follows the `latest` dist-tag on npm.
          makeLatest: ${{ env.PRERELEASE != 'true' }}
          allowUpdates: true

      # A prerelease does not move the `0` / `0.x` tags.
      - name: Update moving version tags
        if: env.PRERELEASE != 'true'
        # Re-point the MAJOR (e.g. 0) and MAJOR.MINOR (e.g. 0.8) tags at this release
        # so consumers can pin `@0` or `@0.8` and pick up newer releases automatically,
        # à la actions/checkout. Semantics differ while pre-1.0: a 0.x minor bump marks
        # a breaking change, so `@0` tracks the latest stable release INCLUDING breaking
        # changes, whereas `@0.8` is the non-breaking patch channel (see the README pin
        # note). At 1.0, `@1` becomes a proper semver compatibility boundary.
        run: |
          MAJOR_TAG=${VERSION%%.*}
          MINOR_TAG=${VERSION%.*}
          for TAG in "$MAJOR_TAG" "$MINOR_TAG"; do
            git tag -f "$TAG"
            git push origin "refs/tags/$TAG" --force
          done
