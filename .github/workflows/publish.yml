name: Publish

# Run from the Actions tab or with `gh workflow run publish.yml -f bump=patch`.
# npm trusted publishing is bound to this file name: keep `npm publish` here.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (on 0.x, a minor bump marks a breaking change)'
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency: release

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build package
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

  release:
    name: Bump version and changelog
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      body: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The changelog action reads the commit that added each fragment.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          npm version "$BUMP" --no-git-tag-version
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Fold changelog fragments
        id: changelog
        uses: weareikko/changelog@600f4225cfd2778967eaffa693e86666c5a2d4bd # 1.0.2
        with:
          command: release
          version: ${{ steps.version.outputs.version }}

      - name: Fail when there is nothing to release
        if: steps.changelog.outputs.changed != 'true'
        run: |
          echo "::error::No fragment in .changelog/: nothing to release."
          exit 1

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .changelog package.json package-lock.json
          git commit -m "chore: release $VERSION"
          git tag "$VERSION"
          git push origin HEAD:main "$VERSION"

  # A tag pushed with GITHUB_TOKEN does not start other workflows, so the
  # publish job runs in this workflow, on the tag the release job pushed.
  publish:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish package
        # Auth is OIDC trusted publishing (id-token: write + --provenance); no npm token needed.
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.release.outputs.version }}
          name: ${{ needs.release.outputs.version }}
          body: ${{ needs.release.outputs.body }}

      - name: Update moving version tags
        # Re-point the MAJOR (e.g. 0) and MAJOR.MINOR (e.g. 0.8) tags at this release
        # so consumers can pin `@0` or `@0.8` and pick up newer releases automatically,
        # à la actions/checkout. Semantics differ while pre-1.0: a 0.x minor bump marks
        # a breaking change, so `@0` tracks the latest stable release INCLUDING breaking
        # changes, whereas `@0.8` is the non-breaking patch channel (see the README pin
        # note). At 1.0, `@1` becomes a proper semver compatibility boundary.
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          MAJOR_TAG=${VERSION%%.*}
          MINOR_TAG=${VERSION%.*}
          for TAG in "$MAJOR_TAG" "$MINOR_TAG"; do
            git tag -f "$TAG"
            git push origin "refs/tags/$TAG" --force
          done
