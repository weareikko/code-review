name: self-review

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Forward the whole CODE_REVIEW_* namespace from org/repo vars + secrets
      # (settings, provider creds, OpenTelemetry via CODE_REVIEW_OTEL_*) — same
      # pattern as the reusable workflow; the CLI de-prefixes non-reserved ones.
      - name: Forward CODE_REVIEW_* config
        env:
          CR_VARS: ${{ toJSON(vars) }}
          CR_SECRETS: ${{ toJSON(secrets) }}
        run: |
          emit() {
            jq -r 'to_entries[]
                   | select(.key | test("^CODE_REVIEW_"; "i"))
                   | "\(.key)<<CR_EOF\n\(.value)\nCR_EOF"' <<<"$1" >> "$GITHUB_ENV"
          }
          emit "$CR_VARS"
          emit "$CR_SECRETS"
      # Load the packaged code-review skill so self-reviews exercise the same
      # skill path consumers use — and so the summary footer's skill links are
      # dogfooded on every PR.
      - name: Run review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODE_REVIEW_SKILLS: code-review
          # Dogfood the review-outcome labels: every self-reviewed PR ends with
          # one of these labels, and the other one is removed.
          CODE_REVIEW_LABELS_ON_FINDINGS: 'review: changes requested'
          CODE_REVIEW_LABELS_ON_CLEAN: 'review: clean'
          # Dogfood one marketplace-sourced MCP server: `github` comes from
          # Anthropic's public plugin marketplace, pinned to a commit so the
          # definition CI connects to cannot change under us. It overrides the
          # .mcp.json entry of the same name, which stays there for local
          # sessions. The plugin's own .mcp.json is the plugin shape (no
          # `mcpServers` wrapper), so this also exercises that parser path.
          # `context7` is NOT sourced from the marketplace: the plugin's URL
          # carries `?client=claude-code-plugin`, which requires an API key,
          # while the plain URL in .mcp.json is anonymous.
          CODE_REVIEW_MARKETPLACES: 'anthropic=https://github.com/anthropics/claude-plugins-official.git#fbe07fb6ce7d51d8e86ca6efdf050059894cdb80'
          CODE_REVIEW_MCP: 'anthropic:github'
          # Keeps the docs and context7 servers in .mcp.json loaded.
          CODE_REVIEW_MCP_DISCOVERY: 'true'
          # The marketplace github plugin reads GITHUB_PERSONAL_ACCESS_TOKEN;
          # map the job token to that name and allow only it (plus GITHUB_TOKEN
          # for the .mcp.json fallback in local runs).
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ github.token }}
          CODE_REVIEW_MCP_ENV: GITHUB_TOKEN,GITHUB_PERSONAL_ACCESS_TOKEN
        run: node bin/code-review.js
