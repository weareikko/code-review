name: self-review

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review pull request
    runs-on: ubuntu-latest
    # The review settings, the provider credentials and the OpenTelemetry
    # configuration reach the CLI as environment: it reads CODE_REVIEW_* and
    # de-prefixes CODE_REVIEW_<PROVIDER>_* credentials. Each value is named.
    # Appending `toJSON(vars)` and `toJSON(secrets)` to $GITHUB_ENV reads as
    # "dump every secret" to GitHub's workflow scanning, which then holds the
    # run as `action_required` until someone approves it by hand. The cost is
    # one line here when the organization gains an option.
    env:
      CODE_REVIEW_MODEL: ${{ vars.CODE_REVIEW_MODEL }}
      CODE_REVIEW_DEPTH: ${{ vars.CODE_REVIEW_DEPTH }}
      CODE_REVIEW_THINKING_LEVEL: ${{ vars.CODE_REVIEW_THINKING_LEVEL }}
      CODE_REVIEW_VERIFY_MODEL: ${{ vars.CODE_REVIEW_VERIFY_MODEL }}
      CODE_REVIEW_OTEL: ${{ vars.CODE_REVIEW_OTEL }}
      CODE_REVIEW_OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.CODE_REVIEW_OTEL_EXPORTER_OTLP_ENDPOINT }}
      CODE_REVIEW_OTEL_EXPORTER_OTLP_PROTOCOL: ${{ vars.CODE_REVIEW_OTEL_EXPORTER_OTLP_PROTOCOL }}
      CODE_REVIEW_OTEL_SEMCONV_STABILITY_OPT_IN: ${{ vars.CODE_REVIEW_OTEL_SEMCONV_STABILITY_OPT_IN }}
      CODE_REVIEW_OPENROUTER_API_KEY: ${{ secrets.CODE_REVIEW_OPENROUTER_API_KEY }}
      CODE_REVIEW_OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.CODE_REVIEW_OTEL_EXPORTER_OTLP_HEADERS }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Load the packaged code-review skill so self-reviews exercise the same
      # skill path consumers use — and so the summary footer's skill links are
      # dogfooded on every PR.
      - name: Run review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODE_REVIEW_SKILLS: code-review
          # Dogfood the review-outcome labels: every self-reviewed PR ends with
          # one of these labels, and the other one is removed.
          CODE_REVIEW_LABELS_ON_FINDINGS: 'review: changes requested'
          CODE_REVIEW_LABELS_ON_CLEAN: 'review: clean'
          # Dogfood one marketplace-sourced MCP server: `github` comes from
          # Anthropic's public plugin marketplace, pinned to a commit so the
          # definition CI connects to cannot change under us. It overrides the
          # .mcp.json entry of the same name, which stays there for local
          # sessions. The plugin's own .mcp.json is the plugin shape (no
          # `mcpServers` wrapper), so this also exercises that parser path.
          # `context7` is NOT sourced from the marketplace: the plugin's URL
          # carries `?client=claude-code-plugin`, which requires an API key,
          # while the plain URL in .mcp.json is anonymous.
          CODE_REVIEW_MARKETPLACES: 'anthropic=https://github.com/anthropics/claude-plugins-official.git#fbe07fb6ce7d51d8e86ca6efdf050059894cdb80'
          CODE_REVIEW_MCP: 'anthropic:github'
          # Keeps the docs and context7 servers from the immutable target commit loaded.
          CODE_REVIEW_MCP_DISCOVERY: target
          # The marketplace github plugin reads GITHUB_PERSONAL_ACCESS_TOKEN;
          # map the job token to that name and allow only it (plus GITHUB_TOKEN
          # for the .mcp.json fallback in local runs).
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ github.token }}
          CODE_REVIEW_MCP_ENV: GITHUB_TOKEN,GITHUB_PERSONAL_ACCESS_TOKEN
        run: node packages/code-review/bin/code-review.js
